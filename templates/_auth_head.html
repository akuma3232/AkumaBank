  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{ auth_page_title }}</title>

  <!-- Prevent theme flicker -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('akuma-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <style>
    :root {
      --login-card-bg: rgba(13, 21, 39, 0.82);
      --login-card-border: rgba(255, 255, 255, 0.12);
      --login-card-border-top: rgba(255, 255, 255, 0.28);
      --login-input-bg: rgba(255, 255, 255, 0.05);
      --login-input-border: rgba(255, 255, 255, 0.12);
      --login-focus-ring: rgba(37, 99, 235, 0.35);
      --login-text-primary: #ffffff;
      --login-text-secondary: rgba(255, 255, 255, 0.65);
      --terminal-bg: rgba(10, 16, 32, 0.88);
      --terminal-border: rgba(59, 130, 246, 0.22);
    }

    [data-theme="light"] {
      --login-card-bg: rgba(255, 255, 255, 0.94);
      --login-card-border: rgba(226, 232, 240, 0.9);
      --login-card-border-top: rgba(255, 255, 255, 0.95);
      --login-input-bg: #f8fafc;
      --login-input-border: #cbd5e1;
      --login-focus-ring: rgba(37, 99, 235, 0.22);
      --login-text-primary: #0f172a;
      --login-text-secondary: #64748b;
      --terminal-bg: rgba(255, 255, 255, 0.9);
      --terminal-border: rgba(203, 213, 225, 0.9);
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 18% 22%, #0e1e48 0%, #060a17 52%, #03050c 100%);
      z-index: 0;
      pointer-events: none;
    }

    [data-theme="light"] .volume-badge {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(5, 150, 105, 0.32);
      color: #047857;
    }

    [data-theme="light"] .login-bg {
      background: radial-gradient(circle at 18% 22%, #dbeafe 0%, #f1f5f9 55%, #e2e8f0 100%);
    }

    .cyber-grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 88%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 88%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.24;
      animation: float-orb 14s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width: 520px; height: 520px; background: #00f2fe; top: -120px; left: -100px; }
    .orb-2 { width: 480px; height: 480px; background: #3b82f6; bottom: -100px; left: 32%; animation-delay: -5s; }
    .orb-3 { width: 400px; height: 400px; background: #8b5cf6; top: 15%; right: -100px; animation-delay: -9s; }

    @keyframes float-orb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -40px) scale(1.1); }
    }

    /* Top Utility Bar */
    .login-topbar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
    }

    .morocco-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--login-text-primary);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }
    [data-theme="light"] .morocco-badge-pill {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(203, 213, 225, 0.85);
    }

    .pulse-dot-green {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Main Container Layout */
    .login-main-container {
      position: relative;
      z-index: 5;
      display: flex;
      flex: 1;
      min-height: calc(100vh - 72px);
    }

    /* Left Showcase Panel */
    .login-showcase {
      flex: 1.25;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 54px;
    }

    .showcase-content {
      max-width: 560px;
      width: 100%;
    }

    /* ── High-Tech Core Terminal Mockup ── */
    .core-terminal-card {
      background: var(--terminal-bg);
      border: 1px solid var(--terminal-border);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 22px;
      margin: 26px 0 24px;
      box-shadow: 
        0 24px 50px -15px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(59, 130, 246, 0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .core-terminal-card:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.65),
        0 0 40px rgba(0, 242, 254, 0.22);
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    [data-theme="light"] .terminal-header {
      border-bottom-color: rgba(226, 232, 240, 0.9);
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
    }
    .t-dot { width: 10px; height: 10px; border-radius: 50%; }
    .t-dot-red { background: #ef4444; }
    .t-dot-yellow { background: #f59e0b; }
    .t-dot-green { background: #10b981; }

    .terminal-title-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--login-text-secondary);
      letter-spacing: 0.05em;
    }

    /* Live Interbank Volume Box */
    .volume-metric-block {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
    }
    .volume-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--login-text-secondary);
      margin-bottom: 3px;
    }
    .volume-amount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--login-text-primary);
      letter-spacing: -0.02em;
    }
    .volume-currency {
      color: #3b82f6;
      font-size: 1rem;
      margin-left: 4px;
    }
    .volume-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    /* SVG Wave Chart */
    .trend-wave-wrap {
      width: 100%;
      height: 72px;
      margin: 8px 0 16px;
    }
    .trend-wave-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Currency Ticker Row */
    .currency-ticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .ticker-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }
    [data-theme="light"] .ticker-pill {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    .ticker-pair {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--login-text-secondary);
      text-transform: uppercase;
    }
    .ticker-rate {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--login-text-primary);
      margin-top: 2px;
    }

    /* Terminal Realtime Log Stream */
    .terminal-feed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.74rem;
    }
    [data-theme="light"] .feed-item {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }
    .feed-text {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--login-text-primary);
    }
    .feed-status {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.68rem;
    }

    /* Key Pillars 3-Column Bar */
    .pillars-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .pillar-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    [data-theme="light"] .pillar-box {
      background: rgba(255, 255, 255, 0.75);
      border-color: #e2e8f0;
    }
    .pillar-icon {
      font-size: 1.25rem;
      color: #3b82f6;
      flex-shrink: 0;
    }
    .pillar-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--login-text-primary);
      line-height: 1.2;
    }
    .pillar-sub {
      font-size: 0.66rem;
      color: var(--login-text-secondary);
      margin-top: 2px;
    }

    /* ── Right Auth Panel ── */
    .login-auth-panel {
      width: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 40px;
      position: relative;
    }

    .auth-glass-card {
      width: 100%;
      max-width: 440px;
      background: var(--login-card-bg);
      border: 1px solid var(--login-card-border);
      border-top: 1px solid var(--login-card-border-top);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 
        0 20px 50px -15px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(59, 130, 246, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Segmented Mode Switcher (Client vs Staff) */
    .auth-mode-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--login-input-border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 26px;
    }
    [data-theme="light"] .auth-mode-switcher {
      background: #f1f5f9;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--login-text-secondary);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      text-decoration: none;
    }
    .auth-tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    [data-theme="light"] .auth-tab-btn.active {
      background: #ffffff;
      color: #1e293b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Custom Form Inputs */
    .custom-input-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .custom-input-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--login-text-secondary);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-lead {
      position: absolute;
      left: 16px;
      color: #3b82f6;
      font-size: 1.15rem;
      pointer-events: none;
      z-index: 2;
    }

    .custom-form-control {
      width: 100%;
      background: var(--login-input-bg);
      border: 1px solid var(--login-input-border);
      border-radius: 12px;
      padding: 13px 16px 13px 46px;
      font-size: 0.95rem;
      color: var(--login-text-primary);
      transition: all 0.2s ease;
    }
    .custom-form-control:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px var(--login-focus-ring);
      color: var(--login-text-primary);
    }
    [data-theme="light"] .custom-form-control:focus {
      background: #ffffff;
    }

    .btn-toggle-eye {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--login-text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      z-index: 2;
      transition: color 0.2s ease;
    }
    .btn-toggle-eye:hover { color: var(--login-text-primary); }

    /* High-Tech Submit Button */
    .btn-auth-submit {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #00d2ff 100%);
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.5);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 8px;
    }
    .btn-auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -4px rgba(37, 99, 235, 0.65);
    }
    .btn-auth-submit:active { transform: translateY(0); }

    .btn-auth-submit::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: rotate(25deg);
      animation: btn-shine-sweep 4s infinite ease-in-out;
    }
    @keyframes btn-shine-sweep {
      0% { left: -60%; }
      30%, 100% { left: 140%; }
    }

    @media (max-width: 992px) {
      .login-main-container { flex-direction: column; }
      .login-showcase { display: none; }
      .login-auth-panel { width: 100%; padding: 24px 16px; }
      .auth-glass-card { padding: 28px 20px; }
    }
  </style>
