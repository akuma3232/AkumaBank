{% extends "base.html" %}
{% block title %}Change Password — AkumaBank{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card-panel">
      <div class="panel-header"><span class="panel-title">Set a New Password</span></div>
      <div class="panel-body">
        <p class="text-muted">Your temporary password can only be used to reach this page. Choose a new password to continue.</p>
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input class="form-control" type="password" id="password" name="password" minlength="12" autocomplete="new-password" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password_confirmation">Confirm new password</label>
            <input class="form-control" type="password" id="password_confirmation" name="password_confirmation" minlength="12" autocomplete="new-password" required />
          </div>
          <button class="btn btn-primary" type="submit">Change password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
