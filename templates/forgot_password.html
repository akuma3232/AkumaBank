<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AkumaBank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-page">
  <main class="login-container justify-content-center">
    <section class="login-right">
      <div class="login-form-wrapper">
        <h1 class="login-form-title">Reset your password</h1>
        <p class="login-form-sub">An owner or admin will review your request.</p>
        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="login-form mt-4">
          <div class="mb-4">
            <label class="form-label fw-semibold" for="email">Customer email</label>
            <input class="form-control form-control-lg" type="email" id="email" name="email" maxlength="254" autocomplete="email" required autofocus />
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Submit reset request</button>
        </form>
        <a class="btn btn-link w-100 mt-3" href="{{ url_for('auth.login') }}">Back to sign in</a>
      </div>
    </section>
  </main>
</body>
</html>
